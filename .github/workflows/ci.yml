name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets

  cpp-world-client:
    name: C++ WorldClient
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Protobuf and gRPC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libprotobuf-dev protobuf-compiler \
            protobuf-compiler-grpc libgrpc++-dev
      - name: Build World Engine for integration test
        run: cargo build --locked -p makise-world
      - name: Configure
        run: cmake -S brain -B build/brain -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/brain --parallel
      - name: Test
        run: ctest --test-dir build/brain --output-on-failure
