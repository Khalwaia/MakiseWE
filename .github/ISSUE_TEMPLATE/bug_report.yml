name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private conversations, production paths, or vulnerability details. Report security issues through GitHub Private Vulnerability Reporting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Include the smallest reproducible case.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the public contract or invariant that should hold.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, fixtures, seed, canonical interval, and relevant artifact digests.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Minimal logs, transition IDs, state hashes, units, and error bounds. Redact sensitive data.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release version.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Affected phase
      options:
        - Legacy executable core
        - Phase 0 contracts and documentation
        - Future phase proposal
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, private conversations, and production paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
