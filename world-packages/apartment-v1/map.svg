<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Карта квартиры Makise V1</title>
  <desc id="desc">Семантическая карта двухкомнатной квартиры в Новосибирске с двадцатью семью якорями взаимодействия.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eadb"/>
      <stop offset="1" stop-color="#d8d0bf"/>
    </linearGradient>
    <linearGradient id="morning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e8e8"/>
      <stop offset="1" stop-color="#b9ceca"/>
    </linearGradient>
    <linearGradient id="evening" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c5ae"/>
      <stop offset="1" stop-color="#b99b87"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#26342f" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#19231f" flood-opacity=".22"/>
    </filter>
    <style>
      .room { stroke:#23332e; stroke-width:4; }
      .room-label { font:700 20px Georgia,serif; fill:#23332e; letter-spacing:.7px; }
      .room-note { font:italic 12px Georgia,serif; fill:#4e5c55; }
      .door { stroke:#8e3f47; stroke-width:7; stroke-linecap:round; }
      .route { fill:none; stroke:#52675e; stroke-width:2; stroke-dasharray:5 7; opacity:.45; }
      .anchor circle { fill:#8e3f47; stroke:#fff7e8; stroke-width:3; }
      .anchor text { font:600 11px Georgia,serif; fill:#1d2824; paint-order:stroke; stroke:#f3eddf; stroke-width:4; stroke-linejoin:round; }
      .fixture { fill:none; stroke:#53675e; stroke-width:3; }
      .furniture { fill:#53675e; opacity:.22; stroke:#30453d; stroke-width:2; }
      .window { stroke:#80a9b0; stroke-width:8; stroke-linecap:round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#17231f"/>
  <rect x="20" y="20" width="1160" height="720" rx="18" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1160" height="720" rx="18" fill="url(#grid)"/>

  <g id="rooms">
    <rect class="room" x="40" y="40" width="360" height="270" fill="url(#morning)"/>
    <rect class="room" x="40" y="310" width="220" height="190" fill="#c7b9a5"/>
    <rect class="room" x="260" y="310" width="200" height="410" fill="#b7baa9"/>
    <rect class="room" x="40" y="500" width="220" height="220" fill="#aebfc0"/>
    <rect class="room" x="400" y="40" width="520" height="400" fill="url(#evening)"/>
    <rect class="room" x="460" y="440" width="460" height="280" fill="#a8b5a6"/>
    <rect class="room" x="920" y="40" width="240" height="400" fill="#b7c9c7"/>

    <text class="room-label" x="58" y="78">КУХНЯ</text>
    <text class="room-note" x="58" y="98">утренний свет · восток</text>
    <text class="room-label" x="58" y="345">ПРИХОЖАЯ</text>
    <text class="room-label" x="278" y="345">КОРИДОР</text>
    <text class="room-label" x="58" y="535">ВАННАЯ</text>
    <text class="room-label" x="420" y="78">ГОСТИНАЯ</text>
    <text class="room-note" x="420" y="98">вечерний свет · юго-запад</text>
    <text class="room-label" x="480" y="478">СПАЛЬНЯ</text>
    <text class="room-note" x="480" y="498">самая тихая комната</text>
    <text class="room-label" x="940" y="78">БАЛКОН</text>
  </g>

  <g id="passages">
    <line class="door" x1="255" y1="385" x2="265" y2="385"/>
    <line class="door" x1="325" y1="305" x2="375" y2="305"/>
    <line class="door" x1="455" y1="360" x2="465" y2="360"/>
    <line class="door" x1="515" y1="435" x2="565" y2="445"/>
    <line class="door" x1="255" y1="545" x2="265" y2="545"/>
    <line class="door" x1="915" y1="225" x2="925" y2="275"/>
    <line class="window" x1="55" y1="40" x2="135" y2="40"/>
    <line class="window" x1="700" y1="720" x2="820" y2="720"/>
    <line class="window" x1="1160" y1="90" x2="1160" y2="330"/>
  </g>

  <g id="furniture-symbols">
    <rect class="fixture" x="55" y="90" width="65" height="55" rx="5"/>
    <rect class="furniture" x="145" y="82" width="120" height="58" rx="6"/>
    <rect class="fixture" x="280" y="82" width="55" height="58" rx="5"/>
    <rect class="fixture" x="325" y="185" width="55" height="80" rx="5"/>
    <ellipse class="furniture" cx="190" cy="235" rx="68" ry="38"/>
    <rect class="furniture" x="485" y="125" width="160" height="92" rx="12"/>
    <rect class="furniture" x="745" y="105" width="150" height="70" rx="5"/>
    <rect class="furniture" x="780" y="315" width="105" height="45" rx="4"/>
    <rect class="furniture" x="555" y="525" width="155" height="115" rx="9"/>
    <rect class="furniture" x="470" y="625" width="85" height="75" rx="5"/>
    <rect class="fixture" x="140" y="585" width="95" height="110" rx="10"/>
    <rect class="fixture" x="180" y="520" width="55" height="65" rx="7"/>
    <circle class="furniture" cx="1035" cy="215" r="48"/>
    <rect class="furniture" x="995" y="345" width="115" height="65" rx="5"/>
  </g>

  <g id="semantic-routes">
    <path class="route" d="M58 405L130 405L220 345L355 400L350 655"/>
    <path class="route" d="M355 400L190 245L190 125L88 125L85 55"/>
    <path class="route" d="M190 125L305 125M190 125L355 225"/>
    <path class="route" d="M355 400L650 255L550 185M650 255L820 155M650 255L820 350M650 255L910 250"/>
    <path class="route" d="M355 400L500 665L620 575L740 575M620 575L755 695M500 665L755 695"/>
    <path class="route" d="M355 400L85 555L80 660L180 655M85 555L210 555"/>
    <path class="route" d="M910 250L1035 215L1140 125M1035 215L1050 380"/>
  </g>

  <g id="anchors">
    <g class="anchor" id="anchor-front_door"><circle cx="58" cy="405" r="8"/><text x="68" y="397">front_door</text></g>
    <g class="anchor" id="anchor-coat_and_shoe_area"><circle cx="130" cy="405" r="8"/><text x="140" y="425">coat_and_shoe_area</text></g>
    <g class="anchor" id="anchor-hall_mirror"><circle cx="220" cy="345" r="8"/><text x="160" y="365">hall_mirror</text></g>
    <g class="anchor" id="anchor-corridor_center"><circle cx="355" cy="400" r="8"/><text x="300" y="420">corridor_center</text></g>
    <g class="anchor" id="anchor-utility_cabinet"><circle cx="350" cy="655" r="8"/><text x="285" y="678">utility_cabinet</text></g>

    <g class="anchor" id="anchor-sink"><circle cx="88" cy="125" r="8"/><text x="64" y="151">sink</text></g>
    <g class="anchor" id="anchor-kitchen_worktop"><circle cx="190" cy="125" r="8"/><text x="132" y="151">kitchen_worktop</text></g>
    <g class="anchor" id="anchor-stove"><circle cx="305" cy="125" r="8"/><text x="285" y="151">stove</text></g>
    <g class="anchor" id="anchor-fridge"><circle cx="355" cy="225" r="8"/><text x="320" y="250">fridge</text></g>
    <g class="anchor" id="anchor-dining_table"><circle cx="190" cy="245" r="8"/><text x="150" y="271">dining_table</text></g>
    <g class="anchor" id="anchor-kitchen_window"><circle cx="85" cy="55" r="8"/><text x="110" y="61">kitchen_window</text></g>

    <g class="anchor" id="anchor-sofa"><circle cx="550" cy="185" r="8"/><text x="528" y="210">sofa</text></g>
    <g class="anchor" id="anchor-work_desk"><circle cx="820" cy="155" r="8"/><text x="780" y="181">work_desk</text></g>
    <g class="anchor" id="anchor-media_bookshelf"><circle cx="820" cy="350" r="8"/><text x="748" y="375">media_bookshelf</text></g>
    <g class="anchor" id="anchor-living_room_center"><circle cx="650" cy="255" r="8"/><text x="575" y="280">living_room_center</text></g>
    <g class="anchor" id="anchor-balcony_door"><circle cx="910" cy="250" r="8"/><text x="835" y="275">balcony_door</text></g>

    <g class="anchor" id="anchor-bed"><circle cx="620" cy="575" r="8"/><text x="598" y="600">bed</text></g>
    <g class="anchor" id="anchor-wardrobe"><circle cx="500" cy="665" r="8"/><text x="465" y="690">wardrobe</text></g>
    <g class="anchor" id="anchor-bedside_table"><circle cx="740" cy="575" r="8"/><text x="700" y="600">bedside_table</text></g>
    <g class="anchor" id="anchor-bedroom_window"><circle cx="755" cy="695" r="8"/><text x="775" y="702">bedroom_window</text></g>

    <g class="anchor" id="anchor-sink_mirror"><circle cx="85" cy="555" r="8"/><text x="55" y="580">sink_mirror</text></g>
    <g class="anchor" id="anchor-shower_bath"><circle cx="180" cy="655" r="8"/><text x="145" y="682">shower_bath</text></g>
    <g class="anchor" id="anchor-toilet"><circle cx="80" cy="660" r="8"/><text x="58" y="687">toilet</text></g>
    <g class="anchor" id="anchor-washing_machine"><circle cx="210" cy="555" r="8"/><text x="135" y="545">washing_machine</text></g>

    <g class="anchor" id="anchor-balcony_table_chair"><circle cx="1035" cy="215" r="8"/><text x="955" y="240">balcony_table_chair</text></g>
    <g class="anchor" id="anchor-balcony_windows"><circle cx="1140" cy="125" r="8"/><text x="1035" y="115">balcony_windows</text></g>
    <g class="anchor" id="anchor-balcony_storage"><circle cx="1050" cy="380" r="8"/><text x="970" y="405">balcony_storage</text></g>
  </g>

  <g id="legend" transform="translate(935 500)">
    <rect width="215" height="190" rx="12" fill="#f3eddf" stroke="#23332e" stroke-width="2"/>
    <text class="room-label" x="18" y="34" font-size="16">УСЛОВНЫЕ ЗНАКИ</text>
    <circle cx="28" cy="65" r="8" fill="#8e3f47" stroke="#fff7e8" stroke-width="3"/>
    <text class="room-note" x="48" y="70">семантический якорь</text>
    <line class="route" x1="18" y1="95" x2="55" y2="95"/>
    <text class="room-note" x="68" y="100">маршрут движка</text>
    <line class="door" x1="18" y1="125" x2="55" y2="125"/>
    <text class="room-note" x="68" y="130">дверь / проход</text>
    <line class="window" x1="18" y1="155" x2="55" y2="155"/>
    <text class="room-note" x="68" y="160">окно</text>
    <text class="room-note" x="18" y="182">масштаб условный · 48 м²</text>
  </g>
</svg>
